name: Archive after Cloudflare deploy

on:
  check_run:
    types: [completed]
    branches: [main]

jobs:
  debug:
   runs-on: ubuntu-latest
   if: false # 跳过该任务
   steps:
      - name: Debug event payload
        run: echo '${{ toJson(github.event.check_run) }}'

  archive:
    runs-on: ubuntu-latest
    # needs: debug
    if: >
      github.event.check_run.check_suite.head_branch == 'main' &&
      startsWith(github.event.check_run.name, 'Workers Builds:') &&
      github.event.check_run.conclusion == 'success'
    steps:
      - name: Trigger Wayback Machine Save
        run: |
          response=$(curl -s -X POST "https://web.archive.org/save" \
            -H "Accept: application/json" \
            -H "Authorization: LOW ${{ secrets.WAYBACK_ACCESS_KEY }}:${{ secrets.WAYBACK_SECRET_KEY }}" \
            -d "url=https://yume-hatsuyuki.moe" \
            -d "capture_all=1")

          echo "Raw response: $response"

          delimiter=$(openssl rand -hex 8)
          {
            echo "RESPONSE<<$delimiter"
            echo "$response"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Parse Job ID
        run: |
          job_id=$(echo "$RESPONSE" | jq -r '.job_id')

          if [ -z "$job_id" ] || [ "$job_id" == "null" ]; then
            echo "::error::未能从响应中解析出 job_id，触发存档可能失败"
            exit 1
          fi

          echo "Job ID: $job_id"
          echo "JOB_ID=$job_id" >> "$GITHUB_ENV"

      - name: Print Status URL
        run: |
          status_url="https://web.archive.org/save/status/${JOB_ID}?_t=$(date +%s)"
          echo "Status URL: $status_url"
          echo "STATUS_URL=$status_url" >> "$GITHUB_ENV"

      - name: Write Job Summary
        run: |
          echo "### 🗄️ Wayback Machine Archive" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job ID: \`$JOB_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 查看状态: [$STATUS_URL]($STATUS_URL)" >> "$GITHUB_STEP_SUMMARY"